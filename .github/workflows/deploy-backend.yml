name: Deploy Backend

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v1
      with:
        node-version: '18'

    - name: Set Up SSH Key
      run: |
        mkdir -p $HOME/.ssh
        echo "${{ secrets.EC2_DEPLOY_KEY }}" > $HOME/.ssh/id_rsa
        chmod 600 $HOME/.ssh/id_rsa
        cat $HOME/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.HOST }} >> $HOME/.ssh/known_hosts

    - name: Debug Secret
      run: |
        echo "${{ secrets.EC2_DEPLOY_KEY }}"

    - name: Transfer Selected Files to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: | 
          ${{ secrets.EC2_DEPLOY_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: ${{ secrets.PORT }}
        script: |
          echo "Deployment Script Content:"
          scp -P ${{ secrets.PORT }} -i ${{ secrets.EC2_DEPLOY_KEY }} ./backend/{cognito.js,index.js,package-lock.json,package.json,.env} ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/var/www/arentals/backend-dist
          ssh -p ${{ secrets.PORT }} -i ${{ secrets.EC2_DEPLOY_KEY }} ${{ secrets.USERNAME }}@${{ secrets.HOST }} <<EOF
            cd /var/www/arentals/backend-dist
            npm install
            pm2 restart all
          EOF
